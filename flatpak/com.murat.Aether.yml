app-id: com.murat.Aether
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: aether

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11

modules:
  - name: aether
    buildsystem: simple
    build-commands:
      - install -d /app/share/aether
      - install -Dm755 aether.py /app/share/aether/aether.py
      - install -Dm644 main.py /app/share/aether/main.py
      - install -Dm644 ollama.py /app/share/aether/ollama.py
      - install -Dm644 database.py /app/share/aether/database.py
      - install -Dm644 config.py /app/share/aether/config.py
      - install -Dm644 version.py /app/share/aether/version.py
      - install -Dm644 style.css /app/share/aether/style.css
      - install -Dm644 data/com.murat.Aether.desktop /app/share/applications/com.murat.Aether.desktop
      - install -Dm644 data/com.murat.Aether.metainfo.xml /app/share/metainfo/com.murat.Aether.metainfo.xml
      - install -Dm644 data/com.murat.Aether.svg /app/share/icons/hicolor/scalable/apps/com.murat.Aether.svg
      - install -Dm755 packaging/aether-launcher /app/bin/aether
    sources:
      - type: git
        url: https://github.com/MOzcelik14/Aether.git
        branch: aether-1.1
